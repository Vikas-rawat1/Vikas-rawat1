    <g font-weight="700" fill="#8A929C">
      <text x="0" y="36" textLength="1500" lengthAdjust="spacing" xml:space="preserve">HTML   CSS   JAVASCRIPT   REACT   REDUX   NODE.JS   TAILWIND   BOOTSTRAP   MYSQL   FIGMA   GIT   </text>
      <text x="1500" y="36" textLength="1500" lengthAdjust="spacing" xml:space="preserve">HTML   CSS   JAVASCRIPT   REACT   REDUX   NODE.JS   TAILWIND   BOOTSTRAP   MYSQL   FIGMA   GIT   </text>
    </g>
    <g fill="#FF6B4A">
      <text x="0" y="36" textLength="1500" lengthAdjust="spacing" xml:space="preserve">     ◆     ◆            ◆       ◆       ◆         ◆          ◆           ◆       ◆       ◆     ◆ </text>
      <text x="1500" y="36" textLength="1500" lengthAdjust="spacing" xml:space="preserve">     ◆     ◆            ◆       ◆       ◆         ◆          ◆           ◆       ◆       ◆     ◆ </text>
    </g>
  </g>
</g>

<line x1="0" y1="57.25" x2="200" y2="57.25" stroke="#FF6B4A" stroke-width="2.5">
  <animate attributeName="x1" values="-200;1280" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0;1480" dur="6s" repeatCount="indefinite"/>
</line>
</svg>
