<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 58" width="1280" height="58" role="img" aria-label="Tech stack: HTML, CSS, JavaScript, React, Redux, Node.js, Tailwind, Bootstrap, MySQL, Figma, Git">
<defs>
