    <stop offset="0.00" stop-color="#000"/>
    <stop offset="0.12" stop-color="#fff"/>
    <stop offset="0.88" stop-color="#fff"/>
    <stop offset="1.00" stop-color="#000"/>
  </linearGradient>
  <mask id="fade"><rect width="1280" height="58" fill="url(#edgeFade)"/></mask>
</defs>

<line x1="0" y1="0.75" x2="1280" y2="0.75" stroke="#8A929C" stroke-width="1.5" opacity="0.35"/>
<line x1="0" y1="57.25" x2="1280" y2="57.25" stroke="#8A929C" stroke-width="1.5" opacity="0.35"/>

<g mask="url(#fade)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1">
  <g>
